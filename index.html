<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>独白 | Soliloquy</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/animations.css">
</head>
<body>
  <!-- WebGL FBM Domain Warping Fluid Water Canvas -->
  <div class="wave-background" id="wave-bg">
    <canvas class="shader-canvas" id="shader-canvas"></canvas>
  </div>

  <!-- Main Container -->
  <div class="container">
    <!-- Quote Display Area -->
    <main class="quote-container">
      <div class="quote-content" id="quote-text" title="点击搜索该语录" role="button" tabindex="0">
        “ 在每一次开启新标签页的时刻，与人类智识的精神独白不期而遇。 ”
      </div>
      <div class="quote-author-line">
        <span class="quote-author" id="quote-author" title="点击搜索该作者" role="button" tabindex="0">
          — 独白
        </span>
      </div>
      <!-- Translation Subtext (Subtle) -->
      <div class="quote-translation" id="quote-translation">
        Meet the spiritual soliloquy of human intellect every time you open a new tab.
      </div>
    </main>
  </div>

  <!-- Color Information Label (Top-Right) -->
  <div class="color-badge" id="color-badge">
    <span class="color-origin" id="color-origin">中國傳統色</span>
    <span class="color-name-zh" id="color-name-zh">黛綠</span>
    <span class="color-name-en" id="color-name-en"></span>
    <span class="color-hex" id="color-hex">#313B35</span>
  </div>

  <!-- Control Buttons (Subtle/Hidden by default, hover to show) -->
  <div class="control-actions">
    <button class="action-btn" id="next-btn" title="下一条语录 & 切换配色 (快捷键: Space)">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M6.5 17.5l6-5.5-6-5.5 1.5-1.5 8 7-8 7z"/>
      </svg>
    </button>
    <button class="action-btn" id="settings-btn" title="偏好设置">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M19.4 13c0-.3.1-.6.1-.9s0-.6-.1-.9l2.1-1.7c.2-.2.2-.5 0-.7l-2-3.5c-.1-.2-.4-.3-.6-.2l-2.5 1c-.5-.4-1.1-.7-1.7-.9l-.4-2.6c0-.2-.3-.4-.5-.4h-4c-.3 0-.5.2-.5.4l-.4 2.6c-.6.2-1.2.5-1.7.9l-2.5-1c-.2-.1-.5 0-.6.2l-2 3.5c-.1.2-.1.5.1.7l2.1 1.7c-.1.3-.1.6-.1.9s0 .6.1.9l-2.1 1.7c-.2.2-.2.5 0 .7l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7.9l.4 2.6c0 .2.3.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.2 1.2-.5 1.7-.9l2.5 1c.2.1.5 0 .6-.2l2-3.5c.1-.2.1-.5-.1-.7l-2.1-1.7zm-7.4 2.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/>
      </svg>
    </button>
  </div>

  <!-- Settings Panel (Slide-out Drawer) -->
  <div class="settings-drawer" id="settings-drawer">
    <div class="settings-header">
      <h3>偏好设置</h3>
      <button class="close-btn" id="settings-close-btn">&times;</button>
    </div>
    <div class="settings-body">
      <!-- Search Engine -->
      <div class="settings-item">
        <label for="search-engine-select">点击跳转搜索引擎</label>
        <select id="search-engine-select">
          <option value="https://www.google.com/search?q=">Google</option>
          <option value="https://www.bing.com/search?q=">Bing</option>
          <option value="https://www.duckduckgo.com/?q=">DuckDuckGo</option>
          <option value="https://www.baidu.com/s?wd=">百度 (Baidu)</option>
        </select>
      </div>


      <div class="settings-item-row">
        <label for="animation-toggle">流动波浪动画</label>
        <div class="toggle-switch">
          <input type="checkbox" id="animation-toggle" checked>
          <span class="slider"></span>
        </div>
      </div>

      <!-- Quick Tips -->
      <div class="settings-tips">
        <h4>快捷键提示</h4>
        <ul>
          <li><strong>Space (空格键)</strong>: 切换下一条语录与配色</li>
          <li><strong>← / → (方向键)</strong>: 单独切换色彩主题</li>
          <li><strong>↑ / ↓ (方向键)</strong>: 单独切换名人语录</li>
        </ul>
      </div>
    </div>
    <div class="settings-footer">
      <span>独白 (Soliloquy) v1.0.0</span>
    </div>
  </div>
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Scripts -->
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
